services:
  mock-ad:
    build: ./mock/mock_ad_server
    ports:
      - "1389:1389"
    restart: unless-stopped

  gateway:
    build: .
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_KEY=${ADMIN_KEY}
      - LDAP_SERVER_URL=ldap://mock-ad:1389
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_DOMAIN=${LDAP_DOMAIN:-}
      - ADMIN_FALLBACK_KEY=${ADMIN_FALLBACK_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME:-superadmin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
